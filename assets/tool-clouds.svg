<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2a9be6"/><stop offset="0.6" stop-color="#8fd3f7"/><stop offset="1" stop-color="#e6f8ff"/>
  </linearGradient>
  <radialGradient id="sun" cx="0.1" cy="0.05" r="0.5">
    <stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#f4fbff"/><stop offset="1" stop-color="#cfeaff"/>
  </linearGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0.95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="bub" cx="0.35" cy="0.3" r="0.75">
    <stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="0.35" stop-color="#e8fbff" stop-opacity="0.3"/>
    <stop offset="0.85" stop-color="#9fe3ff" stop-opacity="0.12"/><stop offset="1" stop-color="#fff" stop-opacity="0.7"/>
  </radialGradient>
  <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b8f06a"/><stop offset="0.5" stop-color="#6cc93a"/><stop offset="1" stop-color="#2f8f1f"/>
  </linearGradient>
  <filter id="sh" x="-20%" y="-30%" width="140%" height="170%">
    <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0b5c99" flood-opacity="0.22"/>
  </filter>
  <filter id="blur"><feGaussianBlur stdDeviation="5"/></filter>
  <clipPath id="frame"><rect width="1200" height="300" rx="22"/></clipPath>
</defs>
<style>
  .c { animation: bob ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-9px); } }
  .drift { animation: drift linear infinite; }
  @keyframes drift { from { transform: translateX(-260px); } to { transform: translateX(1460px); } }
  .b { animation: rise linear infinite; opacity: 0; }
  @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: 0.9; } 85% { opacity: 0.8; } 100% { transform: translateY(-300px); opacity: 0; } }
  text { font-family: 'Segoe UI', Frutiger, 'Myriad Pro', Helvetica, Arial, sans-serif; }
</style>
