<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e8fe0"/>
      <stop offset="0.55" stop-color="#7fcaf5"/>
      <stop offset="1" stop-color="#e4f7ff"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.82" cy="0.18" r="0.45">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#fffbe0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9be15d"/>
      <stop offset="1" stop-color="#4caf2f"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8f06a"/>
      <stop offset="0.4" stop-color="#6cc93a"/>
      <stop offset="1" stop-color="#2f8f1f"/>
    </linearGradient>
    <linearGradient id="hillShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bubble" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#e8fbff" stop-opacity="0.35"/>
      <stop offset="0.85" stop-color="#9fe3ff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.7"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.51" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a5ea8"/>
      <stop offset="1" stop-color="#063a6e"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#04406f" flood-opacity="0.25"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="320" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#sky)"/>
    <rect width="1200" height="320" fill="url(#sun)"/>

    <!-- light rays -->
    <g fill="#ffffff" opacity="0.12">
      <polygon points="985,55 700,0 780,0"/>
      <polygon points="985,55 1200,140 1200,90"/>
      <polygon points="985,55 860,320 940,320"/>
      <polygon points="985,55 1200,0 1120,0"/>
    </g>

    <!-- clouds -->
    <g fill="#ffffff" filter="url(#soft)" opacity="0.85">
      <ellipse cx="160" cy="70" rx="90" ry="22"/>
      <ellipse cx="210" cy="58" rx="55" ry="24"/>
      <ellipse cx="640" cy="40" rx="110" ry="18"/>
      <ellipse cx="1080" cy="150" rx="80" ry="16"/>
    </g>

    <!-- hills -->
    <path d="M0,250 C200,200 380,215 560,240 C760,268 940,205 1200,225 L1200,320 L0,320 Z" fill="url(#hillBack)"/>
    <path d="M0,280 C180,245 360,250 600,272 C820,292 1000,250 1200,262 L1200,320 L0,320 Z" fill="url(#hillFront)"/>
    <path d="M0,280 C180,245 360,250 600,272 C820,292 1000,250 1200,262 L1200,276 C1000,266 820,304 600,286 C360,264 180,260 0,292 Z" fill="url(#hillShine)"/>

    <!-- bubbles -->
    <g stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.2">
      <circle cx="90" cy="190" r="26" fill="url(#bubble)"/>
      <circle cx="140" cy="140" r="12" fill="url(#bubble)"/>
      <circle cx="1010" cy="210" r="34" fill="url(#bubble)"/>
      <circle cx="1080" cy="95" r="16" fill="url(#bubble)"/>
      <circle cx="1130" cy="200" r="10" fill="url(#bubble)"/>
      <circle cx="940" cy="120" r="9" fill="url(#bubble)"/>
      <circle cx="225" cy="230" r="8" fill="url(#bubble)"/>
    </g>
    <g fill="#ffffff" opacity="0.9">
      <ellipse cx="82" cy="180" rx="8" ry="5" transform="rotate(-30 82 180)"/>
      <ellipse cx="999" cy="196" rx="10" ry="6" transform="rotate(-30 999 196)"/>
      <ellipse cx="1075" cy="89" rx="5" ry="3" transform="rotate(-30 1075 89)"/>
    </g>

    <!-- glass panel -->
    <g filter="url(#shadow)">
      <rect x="300" y="78" width="600" height="150" rx="26" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.5"/>
    </g>
    <rect x="312" y="86" width="576" height="60" rx="20" fill="#ffffff" opacity="0.28"/>

    <text x="600" y="152" text-anchor="middle" font-family="'Segoe UI', Frutiger, 'Frutiger Linotype', 'Myriad Pro', Helvetica, Arial, sans-serif" font-size="56" font-weight="600" fill="url(#title)" letter-spacing="1">Lauren Lynch</text>
    <text x="600" y="194" text-anchor="middle" font-family="'Segoe UI', Frutiger, 'Myriad Pro', Helvetica, Arial, sans-serif" font-size="20" fill="#0b4f86" letter-spacing="2">computer science  ·  quinnipiac university</text>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5"/>
</svg>
