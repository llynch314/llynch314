name: generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#1b1b2f&color_dots=#fdf6ee,#c4ecfb,#8fd0f5,#a3a7d9,#7b7fc4
            dist/snake-dark.svg?palette=github-dark&color_snake=#c4ecfb&color_dots=#161b22,#3b3f6e,#5a5fa0,#8fd0f5,#c4ecfb

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
